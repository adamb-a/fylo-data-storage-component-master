<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fylo data storage component — track your cloud storage usage at a glance.">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Fylo data storage component</title>
</head>

<body>
  <main class="container">
    <section class="card card--nav" aria-label="Fylo navigation">
      <img class="logo" src="images/logo.svg" alt="Fylo logo" width="135" height="40">
      <div class="action-icons">
        <button class="action-icon" aria-label="Documents" type="button">
          <img src="images/icon-document.svg" alt="Document icon">
        </button>
        <button class="action-icon" aria-label="Folders" type="button">
          <img src="images/icon-folder.svg" alt="Folder icon">
        </button>
        <button class="action-icon" aria-label="Upload" type="button">
          <img src="images/icon-upload.svg" alt="Upload icon">
        </button>
      </div>
    </section>

    <section class="card card--storage" aria-label="Storage usage">
      <p class="storage-text">You've used <strong>815 GB</strong> of your storage</p>

      <div class="progress-bar">
        <progress class="progress-bar__meter" value="815" max="1000">815 of 1000 GB</progress>
        <div class="progress-bar__labels">
          <span class="progress-bar__label">0 GB</span>
          <span class="progress-bar__label">1000 GB</span>
        </div>
      </div>

      <div class="badge">
        <span class="badge__number">185</span>
        <span class="badge__text">GB Left</span>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Adam</a>.
  </footer>
</body>

</html>
