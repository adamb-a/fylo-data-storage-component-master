<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Fylo data storage component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="images/logo.svg" alt="fylo logo">
      <div class="action-icons-box">
        <div class="action-icon"><img src="images/icon-document.svg" alt="upload icon"></div>
        <div class="action-icon"><img src="images/icon-folder.svg" alt="folder icon"></div>
        <div class="action-icon"><img src="images/icon-upload.svg" alt="upload icon"></div>
      </div>
    </header>
    <article>
      <div>
        <h2>
          You’ve used 815 GB of your storage
        </h2>
        <input type="range" name="progress" id="progress" value="85.5" disabled>
        <div>
          <h2>0 GB</h2>
          <h2>1000 GB</h2>
        </div>
      </div>
      <div>
        <h1>185</h1>
        <h2>GB Left</h2>
      </div>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
